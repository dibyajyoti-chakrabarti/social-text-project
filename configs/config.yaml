# Central configuration. Paths are relative to the repo root.

paths:
  raw: data/raw
  interim: data/interim
  processed: data/processed
  cache: data/cache
  annotations: annotations
  reports: reports
  models: models          # trained local models (gitignored)

# LLM providers. All expose an OpenAI-compatible chat completions API.
# `rpm` = client-side requests-per-minute throttle.
# `daily_limit` = requests per day we allow ourselves (tracked locally; null = unlimited),
# counted per key and calendar day in `quota_tz`, the timezone where the provider's quota resets.
providers:
  gemini:
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    # Several keys from separate projects, each with its own quota, used in rotation.
    # A key whose provider-side cap is lower than daily_limit (new projects allow 500/day)
    # is detected from the 429 and skipped for the rest of the day.
    api_key_env: GEMINI_KEY_*   # GEMINI_KEY_1, GEMINI_KEY_2, … in numeric order
    rpm: 10
    daily_limit: 1000
    quota_tz: America/Los_Angeles  # Gemini free-tier quotas reset at midnight Pacific
  groq:
    base_url: https://api.groq.com/openai/v1
    api_key_env: GROQ_KEY
    rpm: 25
    daily_limit: 1000
  openrouter:
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    rpm: 15
    daily_limit: 50

# Named model profiles used by pipeline stages. A stage refers to a profile name,
# never to a raw model id, so swapping models is a one-line config change.
# There is deliberately NO automatic fallback between profiles: an experiment's
# results must come from exactly the model it reports.
models:
  primary:
    provider: gemini
    model: gemini-3.5-flash-lite
  secondary:
    provider: groq
    model: openai/gpt-oss-20b
  tertiary:
    provider: openrouter
    model: nvidia/nemotron-3-super-120b-a12b:free

llm:
  temperature: 0.0
  max_retries: 6
  timeout_s: 120

# Data collection window and sources (Phase 1).
data:
  since: "2025-10-16"   # inclusive, UTC
  until: "2026-10-16"   # exclusive, UTC
  min_words: 4          # shorter items ("very awesome") carry no request signal
  playstore:
    app_id: com.spotify.music
    lang: en
    country: us
  reddit:
    # r/spotify is now a playlist-sharing sub; app discussion lives in r/truespotify.
    subreddit: truespotify
    # Top-level comments are fetched only for posts likely to discuss features.
    comment_flairs: ["Feature Request", "Rant", "Discussion", "News", "Suggestion"]
    comment_min_post_comments: 3
    comment_max_posts: 3000
    comment_min_score: 2

# Intent detection (Phase 3). Choices below were made on the gold dev split only.
detect:
  silver:
    profile: primary      # LLM that produces the silver labels
    prompt: v2
    batch_size: 20
    seed: 42
    per_source:           # gold items are excluded before sampling
      play: 8000
      reddit_post: 3000
      reddit_comment: 1000
  deployed:               # local model that classifies the full corpus (chosen on dev)
    method: setfit
    train: silver
    max_steps: 2000
    seed: 0

# Feature extraction (Phase 4).
extract:
  llm:
    profile: primary
    batch_size: 20
  judge:                  # grades extractions; a different model family from the extractor
    profile: secondary
    batch_size: 10
  eval:
    embed_model: sentence-transformers/all-MiniLM-L6-v2
    threshold: 0.6        # cosine similarity at which two phrases count as the same feature
    corpus_sample: 100    # predicted-FR corpus items graded by the judge
    seed: 0
  competitors:            # canonical name: lowercase aliases matched as whole words
    Apple Music: [apple music, itunes]
    YouTube Music: [youtube music, yt music, youtube, ytmusic, yt]
    Amazon Music: [amazon music]
    Tidal: [tidal]
    Deezer: [deezer]
    SoundCloud: [soundcloud, sound cloud]
    Pandora: [pandora]
    Audiomack: [audiomack]
    JioSaavn: [jiosaavn, saavn]
    Gaana: [gaana]
    Wynk: [wynk]
    Qobuz: [qobuz]
    Pocket Casts: [pocket casts, pocketcasts]
    Audible: [audible]

# Theme clustering (Phase 5).
cluster:
  embed_model: sentence-transformers/all-MiniLM-L6-v2
  seed: 0
  umap: {n_components: 5, n_neighbors: 15}
  grid:
    min_cluster_size: [5, 8, 12, 20, 30]
    min_samples: [2, 5]
  outlier_threshold: 0.6  # attach a noise phrase to the nearest centroid at cosine ≥ this
  select:                 # pick the highest-silhouette setting that satisfies these
    max_outlier_mentions: 0.2
    min_clusters: 30
    max_clusters: 250
  naming:
    profile: primary
  bertopic:
    min_topic_size: 30
  purity:                 # sample per method for the purity check
    clusters: 30          # judged by the LLM judge (both methods)
    members: 10
    human: 20             # of method A's sample, also checked by hand (apps/purity.py)
  judge:
    profile: secondary

# Ranking and trends (Phase 5).
rank:
  weights: {volume: 0.4, engagement: 0.2, dissatisfaction: 0.2, growth: 0.2}
  window_weeks: 13        # recent quarter vs the quarter before
  min_support: 20         # items in both windows needed to compute growth
  trend: {min_ratio: 1.5, min_recent: 15, alpha: 0.05}

# Insights (Phase 5).
insights:
  min_items: 15
  existing:
    profile: primary
    candidates: 3         # closest catalogue entries shown to the LLM per theme
