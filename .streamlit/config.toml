[server]
headless = true   # no first-run email prompt; open the printed URL manually

[browser]
gatherUsageStats = false

[theme]   # light, matching the report figures (src/frminer/viz.py)
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#fcfcfb"
secondaryBackgroundColor = "#f0efec"
textColor = "#0b0b0b"

[client]
toolbarMode = "viewer"   # hide the Deploy button
