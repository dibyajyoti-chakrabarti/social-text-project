[project]
name = "frminer"
version = "0.1.0"
description = "Extracting customer feature requests from unstructured product feedback"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "en-core-web-sm",
    "google-play-scraper>=1.2.7",
    "httpx>=0.28.1",
    "lingua-language-detector>=2.2.0",
    "matplotlib>=3.11.2",
    "openai>=3.0",
    "pandas>=2.2",
    "pyarrow>=16",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "spacy>=3.8.16",
    "streamlit>=1.66.0",
    "tabulate>=0.10.0",
    "tqdm>=4.66",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

# Local ML stack (SetFit, embeddings). CUDA 12.8 wheels on Linux for the RTX 50xx GPU.
# CI skips it: `uv sync --no-group ml`.
ml = [
    "torch>=2.8",
    "sentence-transformers>=5.0",
    "setfit>=1.1",
    "umap-learn>=0.5.12",
    "bertopic>=0.17.4",
]

[tool.uv]
default-groups = ["dev", "ml"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/frminer"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# One regex per line reads better than split string literals.
"src/frminer/detect/rules.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
