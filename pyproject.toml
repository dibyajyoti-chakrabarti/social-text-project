[project]
name = "frminer"
version = "0.1.0"
description = "Extracting customer feature requests from unstructured product feedback"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "google-play-scraper>=1.2.7",
    "httpx>=0.28.1",
    "lingua-language-detector>=2.2.0",
    "matplotlib>=3.11.2",
    "openai>=3.0",
    "pandas>=2.2",
    "pyarrow>=16",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.9.1",
    "streamlit>=1.66.0",
    "tabulate>=0.10.0",
    "tqdm>=4.66",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/frminer"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
